name: Debugger configuration regression builds
on:
  pull_request:
    branches: [ai-re-agent]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release SDL2, Agent Debug SDL2]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Compile and run MCP disabled-transport regression
        if: matrix.configuration == 'Agent Debug SDL2'
        run: python tests/agent/test_mcp_disabled_link.py --compiler clang++
      - name: Build configuration
        shell: pwsh
        run: |
          msbuild vs/dosbox-x.sln /m:4 /p:Configuration="${{ matrix.configuration }}" /p:Platform=x64 /p:PlatformToolset=v145 /p:TrackFileAccess=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
